services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${BACKEND_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./app.db}

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      - backend
